<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1090" viewBox="0 0 1040 1090" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Paper Polish · Writing and iterative refinement</title><desc id="desc">The standard flow prepares text, scope, mode and context, generates output and allows review or export. Ultra is started separately: a generator and evaluator iterate with feedback until passing, reaching the round limit or user stop. Generator failure stops the loop; evaluator failure can continue.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c8599"/></marker></defs>
<rect width="1040" height="1090" rx="20" fill="#fff"/>
<g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif"><text x="44" y="49" text-anchor="start" font-size="27" font-weight="650" fill="#18344c">Paper Polish · Writing and iterative refinement</text>
<rect x="25" y="85" width="475" height="970" rx="20" fill="#f8fafc" stroke="#d8e2ea"/>
<rect x="540" y="85" width="475" height="970" rx="20" fill="#f8fafc" stroke="#d8e2ea"/>
<path d="M262 235 V280" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M262 390 V440" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M262 550 V600" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M262 675 V725" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M262 825 V885" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M777 235 V290" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M777 390 V450" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M777 560 V635" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M600 678 H568 V340 H600" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M777 730 V885" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="262.5" y="118" text-anchor="middle" font-size="20" font-weight="500" fill="#52697c">Standard workflow</text>
<text x="777.5" y="118" text-anchor="middle" font-size="20" font-weight="500" fill="#52697c">Ultra · started separately</text>
<g data-flow-box="true">
<rect x="65" y="145" width="395" height="90" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="262.5" y="183" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">Enter text or selected key points</text>
<text x="262.5" y="211" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">(key points: paragraph generation)</text>
</g>
<g data-flow-box="true">
<rect x="65" y="280" width="395" height="110" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="262.5" y="328" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">Choose scope, mode, model</text>
<text x="262.5" y="356" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">and output language</text>
</g>
<g data-flow-box="true">
<rect x="65" y="440" width="395" height="110" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="262.5" y="488" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">Add available references,</text>
<text x="262.5" y="516" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">terminology and requirements</text>
</g>
<g data-flow-box="true">
<rect x="65" y="600" width="395" height="75" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="262.5" y="644.5" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">Generate the result</text>
</g>
<g data-flow-box="true">
<rect x="65" y="725" width="395" height="100" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="262.5" y="768" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">Optional: key-point extraction</text>
<text x="262.5" y="796" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">and terminology suggestions</text>
</g>
<g data-flow-box="true">
<rect x="65" y="885" width="395" height="90" rx="14" fill="#e3f3ee" stroke="#8eb9aa" stroke-width="1.5"/>
<text x="262.5" y="937" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">Review · export · next round</text>
</g>
<g data-flow-box="true">
<rect x="600" y="145" width="355" height="90" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="777.5" y="183" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">Start from an existing result</text>
<text x="777.5" y="211" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">or the input text</text>
</g>
<g data-flow-box="true">
<rect x="600" y="290" width="355" height="100" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="777.5" y="333" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">Generator refines the text</text>
<text x="777.5" y="361" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">Failure / empty result: stop</text>
</g>
<g data-flow-box="true">
<rect x="600" y="450" width="355" height="110" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="777.5" y="484" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">Evaluator returns feedback</text>
<text x="777.5" y="512" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">Failure: record null</text>
<text x="777.5" y="540" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">and continue unless stopped</text>
</g>
<g data-flow-box="true">
<rect x="600" y="635" width="355" height="95" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="777.5" y="675.5" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">Pass / round limit / user stop?</text>
<text x="777.5" y="703.5" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">Otherwise: next round</text>
</g>
<g transform="rotate(-90 554 514)"><text x="554" y="514" text-anchor="middle" font-size="16" font-weight="500" fill="#52697c">Feedback · next round</text></g>
<g data-flow-box="true">
<rect x="600" y="885" width="355" height="90" rx="14" fill="#e3f3ee" stroke="#8eb9aa" stroke-width="1.5"/>
<text x="777.5" y="923" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">Inspect iteration history</text>
<text x="777.5" y="951" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">and reuse the chosen result</text>
</g>
<text x="777" y="1016" text-anchor="middle" font-size="17" font-weight="500" fill="#52697c">Stop conditions end the current loop.</text>
</g></svg>
