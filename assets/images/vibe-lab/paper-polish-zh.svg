<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1090" viewBox="0 0 1040 1090" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">Paper Polish · 写作与迭代优化</title><desc id="desc">常规流程准备文本、作用域、模式与上下文，生成结果并支持查看或导出。Ultra 独立启动，生成器与评估器带反馈迭代，直至通过、达到轮数上限或用户停止；生成失败结束，评估失败可继续。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c8599"/></marker></defs>
<rect width="1040" height="1090" rx="20" fill="#fff"/>
<g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif"><text x="44" y="49" text-anchor="start" font-size="27" font-weight="650" fill="#18344c">Paper Polish · 写作与迭代优化</text>
<rect x="25" y="85" width="475" height="970" rx="20" fill="#f8fafc" stroke="#d8e2ea"/>
<rect x="540" y="85" width="475" height="970" rx="20" fill="#f8fafc" stroke="#d8e2ea"/>
<path d="M262 235 V280" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M262 390 V440" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M262 550 V600" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M262 675 V725" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M262 825 V885" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M777 235 V290" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M777 390 V450" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M777 560 V635" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M600 678 H568 V340 H600" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M777 730 V885" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="262.5" y="118" text-anchor="middle" font-size="20" font-weight="500" fill="#52697c">常规流程</text>
<text x="777.5" y="118" text-anchor="middle" font-size="20" font-weight="500" fill="#52697c">Ultra · 独立启动</text>
<g data-flow-box="true">
<rect x="65" y="145" width="395" height="90" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="262.5" y="183" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">输入文本或已选要点</text>
<text x="262.5" y="211" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">（要点用于段落生成）</text>
</g>
<g data-flow-box="true">
<rect x="65" y="280" width="395" height="110" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="262.5" y="328" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">选择作用域、模式、模型</text>
<text x="262.5" y="356" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">及输出语言</text>
</g>
<g data-flow-box="true">
<rect x="65" y="440" width="395" height="110" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="262.5" y="488" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">组合可用参考资料、</text>
<text x="262.5" y="516" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">术语与附加要求</text>
</g>
<g data-flow-box="true">
<rect x="65" y="600" width="395" height="75" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="262.5" y="644.5" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">生成结果</text>
</g>
<g data-flow-box="true">
<rect x="65" y="725" width="395" height="100" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="262.5" y="768" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">可选：提取要点</text>
<text x="262.5" y="796" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">与术语推荐</text>
</g>
<g data-flow-box="true">
<rect x="65" y="885" width="395" height="90" rx="14" fill="#e3f3ee" stroke="#8eb9aa" stroke-width="1.5"/>
<text x="262.5" y="937" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">查看 · 导出 · 下一轮</text>
</g>
<g data-flow-box="true">
<rect x="600" y="145" width="355" height="90" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="777.5" y="183" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">从已有结果</text>
<text x="777.5" y="211" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">或输入文本开始</text>
</g>
<g data-flow-box="true">
<rect x="600" y="290" width="355" height="100" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="777.5" y="333" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">生成器优化文本</text>
<text x="777.5" y="361" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">失败 / 空结果：结束循环</text>
</g>
<g data-flow-box="true">
<rect x="600" y="450" width="355" height="110" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="777.5" y="484" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">评估器返回反馈</text>
<text x="777.5" y="512" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">失败：记录空评估</text>
<text x="777.5" y="540" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">未触发终止条件则继续</text>
</g>
<g data-flow-box="true">
<rect x="600" y="635" width="355" height="95" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="777.5" y="675.5" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">通过 / 轮数上限 / 用户停止？</text>
<text x="777.5" y="703.5" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">否则进入下一轮</text>
</g>
<g transform="rotate(-90 554 514)"><text x="554" y="514" text-anchor="middle" font-size="16" font-weight="500" fill="#52697c">反馈 · 下一轮</text></g>
<g data-flow-box="true">
<rect x="600" y="885" width="355" height="90" rx="14" fill="#e3f3ee" stroke="#8eb9aa" stroke-width="1.5"/>
<text x="777.5" y="923" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">查看迭代记录</text>
<text x="777.5" y="951" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">并使用选定结果</text>
</g>
<text x="777" y="1016" text-anchor="middle" font-size="17" font-weight="500" fill="#52697c">终止条件结束当前循环。</text>
</g></svg>
