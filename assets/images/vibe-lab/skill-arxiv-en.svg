<rect width="1040" height="660" rx="20" fill="#fff"/>
<g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif"><text x="44" y="49" text-anchor="start" font-size="27" font-weight="650" fill="#18344c">arXiv · Search to full text</text>
