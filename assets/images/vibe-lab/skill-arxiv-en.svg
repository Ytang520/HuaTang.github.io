<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" role="img" aria-labelledby="title desc" lang="en">
<title id="title">arXiv · Search to full text</title><desc id="desc">An arXiv ID retrieves a paper directly; titles and topics use fuzzy search; keyword searches require query confirmation before results, metadata, and PDFs.</desc>
