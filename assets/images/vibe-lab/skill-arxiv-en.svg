</g>
<g data-flow-box="true">
<rect x="705" y="220" width="280" height="80" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="845" y="267" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">Exact keywords</text>
</g>
