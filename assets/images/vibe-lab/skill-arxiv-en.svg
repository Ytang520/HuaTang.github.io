<path d="M845 425 V468 H520" fill="none" stroke="#6c8599" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-flow-box="true">
<rect x="310" y="90" width="420" height="70" rx="14" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/>
<text x="520" y="132" text-anchor="middle" font-size="21" font-weight="500" fill="#243b53">Identify the research input</text>
</g>
